name: "Setup Foundry"
description: "Installs Foundry (forge, cast, anvil) at a pinned version"

outputs:
  foundry-version:
    description: "The version of Foundry that was installed"
    value: ${{ steps.set-foundry-version.outputs.foundry-version }}

runs:
  using: "composite"
  steps:
    - name: Set Foundry version
      id: set-foundry-version
      shell: bash
      run: echo "foundry-version=v1.5.1" >> $GITHUB_OUTPUT

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e # v1.5.0
      with:
        version: ${{ steps.set-foundry-version.outputs.foundry-version }}
